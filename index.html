<!doctype html>
<!-- Toff Stone Quotation: the only page of the app. Everything (forms, sheet, saved list) lives here; app.js switches between views. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toff Stone Quotation</title>
<meta name="description" content="Make glazing quotations for clients, then print, save as PDF or send on WhatsApp.">
<meta name="theme-color" content="#0B1526">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
<!-- Apply the saved light/dark choice before the page is drawn, so it doesn't flash the other theme. -->
<script>try { var t = JSON.parse(localStorage.getItem('tsq.theme')); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
<div class="wrap" id="app">

  <header class="top">
    <div class="brand">
      <img class="mark" src="icons/mark.png" alt="" width="44" height="44">
      <div>
        <h1 id="viewTitle">Quotation</h1>
        <p class="note">Ref <span class="num" id="refLabel"></span><span id="savedTag" class="saved-tag" hidden>Saved</span></p>
      </div>
    </div>
    <div class="top-btns">
      <button class="btn small" type="button" id="installBtn" hidden>Install app</button>
      <button class="btn small theme-btn" type="button" id="themeBtn" aria-label="Switch theme" title="Light / dark theme">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="btn small" type="button" id="savedBtn">Saved</button>
      <button class="btn small" type="button" id="newBtn">New</button>
    </div>
  </header>

  <div class="confirm" id="confirmNew" role="alertdialog" aria-labelledby="confirmTxt" hidden>
    <span id="confirmTxt"><strong>Start a new quotation?</strong> Save this one first if you want to keep it.</span>
    <span class="row"><button class="btn small" type="button" id="cancelNew">Cancel</button><button class="btn primary small" type="button" id="doNew">Start new</button></span>
  </div>

  <!-- ============ EDIT VIEW ============ -->
  <main id="editView" class="stack">
    <details class="panel" id="bizPanel">
      <summary><h2>Your company</h2><span class="note" id="bizSummary"></span></summary>
      <div class="stack">
        <div class="logo-row">
          <div class="logo-prev" id="logoPrev">No logo</div>
          <label for="logoFile" class="btn small">Change logo<input id="logoFile" type="file" accept="image/*" class="sr"></label>
          <button type="button" class="btn danger" id="logoRemove" hidden>Use Toff Stone logo</button>
        </div>
        <label for="bizName">Company name<input id="bizName" autocomplete="organization" placeholder="Toff Stone Ventures"></label>
        <div class="grid">
          <label for="bizPhone">Telephone<input id="bizPhone" inputmode="tel" placeholder="024 000 0000"></label>
          <label for="bizWa">WhatsApp<input id="bizWa" inputmode="tel" placeholder="020 000 0000"></label>
          <label for="bizEmail">Email<input id="bizEmail" type="email" inputmode="email" placeholder="name@gmail.com"></label>
          <label for="bizLoc">Location<input id="bizLoc" placeholder="Anloga, Kumasi"></label>
        </div>
        <label for="terms">Terms and conditions<textarea id="terms" rows="5"></textarea></label>
        <p class="note">Saved on this device and used on every quotation.</p>
      </div>
    </details>

    <section class="panel stack" aria-labelledby="clientH">
      <h2 id="clientH">Client</h2>
      <label for="cName">Name of client<input id="cName" placeholder="Kofi Mensah"></label>
      <div class="grid">
        <label for="cPhone">Telephone<input id="cPhone" inputmode="tel" placeholder="024 000 0000"></label>
        <label for="cEmail">Email<input id="cEmail" type="email" inputmode="email" placeholder="Optional"></label>
        <label for="estDate">Date<input id="estDate" type="date"></label>
        <label for="validDays">Valid for (days)<input id="validDays" type="number" inputmode="numeric" min="1" step="1"></label>
      </div>
    </section>

    <section class="stack list-sec" aria-labelledby="itemsH">
      <h2 id="itemsH">Glass</h2>
      <div id="items" class="stack"></div>
      <button class="btn add" type="button" id="addItem">+ Add glass item</button>
    </section>

    <section class="stack list-sec" aria-labelledby="accH">
      <h2 id="accH">Accessories</h2>
      <div id="accs" class="stack"></div>
      <p class="note" id="noAcc">Hinges, handles, gaskets, holders and so on.</p>
      <button class="btn add" type="button" id="addAcc">+ Add accessory</button>
    </section>
    <div class="sr" aria-live="polite" id="live"></div>

    <section class="panel stack" aria-labelledby="extraH">
      <h2 id="extraH">Labour, discount and payment</h2>
      <label for="labour">Labour / fitting (GH₵)<input id="labour" inputmode="decimal" placeholder="0.00"></label>
      <div class="disc">
        <label for="disc">Discount<input id="disc" inputmode="decimal" placeholder="0"></label>
        <label for="discType">Type<select id="discType"><option value="pct">%</option><option value="amt">GH₵</option></select></label>
      </div>
      <label for="deposit">Deposit paid (GH₵)<input id="deposit" inputmode="decimal" placeholder="0.00"></label>
    </section>

    <section class="panel stack summary-panel" aria-labelledby="sumH">
      <h2 id="sumH">Summary</h2>
      <div id="summary" class="stack tight"></div>
      <button class="btn save" type="button" id="saveBtn">Save quotation</button>
    </section>
  </main>

  <!-- ============ SHEET VIEW ============ -->
  <section id="sheetView" class="stack" hidden aria-label="Quotation sheet">
    <div class="sheet-actions">
      <button class="btn primary" type="button" id="printBtn">Print / Save PDF</button>
      <button class="btn" type="button" id="copyBtn">Copy as text</button>
      <button class="btn" type="button" id="picBtn">Save as picture</button>
    </div>
    <p class="note" id="copyMsg" aria-live="polite"></p>
    <textarea id="copyFallback" hidden readonly aria-label="Quotation text to copy"></textarea>
    <div class="frame" id="frame"><div class="sheet" id="sheet"></div></div>
  </section>

  <!-- ============ SAVED VIEW ============ -->
  <section id="savedView" class="stack" hidden aria-label="Saved quotations">
    <label for="savedSearch">Search by client or ref<input id="savedSearch" type="search" placeholder="Kofi"></label>
    <div id="savedList" class="stack"></div>
  </section>

  <nav class="actions" id="actions">
    <button class="btn" type="button" id="viewBtn">View quotation</button>
    <a class="btn primary" id="waBtn" href="https://wa.me/" target="_blank" rel="noopener">Send on WhatsApp</a>
    <p class="note wa-msg" id="waMsg" aria-live="polite" hidden></p>
  </nav>
</div>
<script src="app.js"></script>
</body>
</html>
